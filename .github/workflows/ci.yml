name: Tests

# See https://github.com/ScoopInstaller/Extras/blob/master/.github/workflows/ci.yml

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test_powershell:
    name: WindowsPowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          path: "my_bucket"
      - name: Checkout Scoop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScoopInstaller/Scoop
          path: "scoop_core"
      - name: Init and Test
        shell: powershell
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\scoop_core\test\bin\init.ps1
          .\my_bucket\bin\test.ps1

  test_pwsh:
    name: PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout Bucket
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          path: "my_bucket"
      - name: Checkout Scoop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScoopInstaller/Scoop
          path: "scoop_core"
      - name: Init and Test
        shell: pwsh
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\scoop_core\test\bin\init.ps1
          .\my_bucket\bin\test.ps1
